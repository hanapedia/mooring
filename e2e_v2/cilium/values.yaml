bgpControlPlane:
  enabled: true
bpf:
  hostLegacyRouting: false
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
devices: "node0"
enableIPv4Masquerade: false
ipam:
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.64.0.0/16
k8sServiceHost: kind-with-bgp-control-plane
k8sServicePort: 6443
kubeProxyReplacement: true
l7Proxy: false
nodePort:
  directRoutingDevice: "node0"
  enabled: true
routingMode: "native"
