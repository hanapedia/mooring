# https://taskfile.dev
version: '3'

vars:
  K8S_VERSION: '{{.K8S_VERSION | default "1.34.8"}}'
  CILIUM_REPO: '{{.CILIUM_REPO | default "https://github.com/cilium/cilium.git"}}'
  CILIUM_REPO_DIR: 'worktrees/cilium.git'
  CILIUM_DIR: 'worktrees/v{{.CILIUM_VERSION}}'
  CILIUM_IMAGE: '{{.CILIUM_IMAGE | default "ghcr.io/cybozu/cilium"}}'
  CILIUM_VERSION: '{{.CILIUM_VERSION | default "1.17.12.3"}}'
  CILIUM_TAG: '{{.CILIUM_TAG | default "1.17.12.3"}}'
  CILIUM_OPERATOR_IMAGE: '{{.CILIUM_OPERATOR_IMAGE | default "ghcr.io/cybozu/cilium-operator-generic"}}'
  CILIUM_OPERATOR_VERSION: '{{.CILIUM_OPERATOR_VERSION | default "1.17.12.2"}}'
  CILIUM_OPERATOR_TAG: '{{.CILIUM_OPERATOR_TAG | default "1.17.12.2"}}'

tasks:
  install:
    desc: Generate manifests, install Cilium CNI, and wait for readiness
    vars:
      K8S_VERSION: '{{.K8S_VERSION | default "1.34.8"}}'
    cmds:
      - task: generate-upstream-manifests
        vars: { K8S_VERSION: "{{.K8S_VERSION}}" }
      - task: load-image
      - task: apply
      - task: wait

  load-image:
    desc: Pull and load Cilium agent and operator images into kind
    cmds:
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.CILIUM_IMAGE}}:{{.CILIUM_TAG}}" }
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.CILIUM_OPERATOR_IMAGE}}:{{.CILIUM_OPERATOR_TAG}}" }
      - kind load docker-image {{.CILIUM_IMAGE}}:{{.CILIUM_TAG}} --name kind-with-bgp
      - kind load docker-image {{.CILIUM_OPERATOR_IMAGE}}:{{.CILIUM_OPERATOR_TAG}} --name kind-with-bgp

  apply:
    desc: Apply Cilium manifests to the cluster
    cmds:
      - kustomize build --load-restrictor=LoadRestrictionsNone . | kubectl apply -f -

  wait:
    desc: Wait for Cilium to become ready
    cmds:
      - kubectl wait -n kube-system --for=condition=available --timeout=300s deployment/cilium-operator
      - kubectl wait -n kube-system --for=condition=ready --timeout=300s pod -l app.kubernetes.io/name=cilium-agent
      - kubectl apply -f bgp.yaml

  generate-upstream-manifests:
    desc: Generate Cilium upstream manifests via helm template
    vars:
      K8S_VERSION: '{{.K8S_VERSION | default "1.34.8"}}'
      CILIUM_OPERATOR_IMAGE_STRIPPED:
        sh: echo "{{.CILIUM_OPERATOR_IMAGE}}" | sed 's/-generic//'
    cmds:
      - task: init-repo
      - task: add-worktree
      - >
        helm template {{.CILIUM_DIR}}/install/kubernetes/cilium/
        --namespace=kube-system
        --kube-version={{.K8S_VERSION}}
        --values values.yaml
        --set image.repository={{.CILIUM_IMAGE}}
        --set image.tag={{.CILIUM_TAG}}
        --set image.useDigest=false
        --set operator.image.repository={{.CILIUM_OPERATOR_IMAGE_STRIPPED}}
        --set operator.image.tag={{.CILIUM_OPERATOR_TAG}}
        --set operator.image.useDigest=false > upstream.yaml

  init-repo:
    desc: Bare-clone Cilium repository (once; idempotent)
    cmds:
      - mkdir -p worktrees
      - git clone --bare {{.CILIUM_REPO}} {{.CILIUM_REPO_DIR}}
    status:
      - test -d "{{.CILIUM_REPO_DIR}}"

  add-worktree:
    desc: Create a git worktree for the specified version (idempotent)
    cmds:
      - git -C {{.CILIUM_REPO_DIR}} fetch --tags origin
      - git -C {{.CILIUM_REPO_DIR}} worktree add ../v{{.CILIUM_VERSION}} v$(echo {{.CILIUM_VERSION}} | cut -d. -f1,2,3)
    status:
      - test -d "{{.CILIUM_DIR}}"

  docker-pull:
    desc: Pull a specified image if it doesn't exist locally
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default "ghcr.io/cybozu/cilium:latest"}}'
    cmds:
      - |
        if ! docker image inspect {{.IMAGE_NAME}} &> /dev/null; then
          docker pull --platform=linux/amd64 {{.IMAGE_NAME}}
        else
          echo "{{.IMAGE_NAME}} already exists locally, skip pulling."
        fi
