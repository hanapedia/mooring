router id 10.72.0.1;

log stderr all;

protocol device {
  scan time 10;
}

protocol kernel {
    merge paths;
    ipv4 {
        export all;
    };
}

template bgp tor {
  local as 65000;

  ipv4 {
    import all;
    export all;
    next hop self;
  };
}

protocol bgp tor0 from tor {
  neighbor 10.72.0.2 as 65001;
}
