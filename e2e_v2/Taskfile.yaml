# https://taskfile.dev
version: '3'

includes:
  coil:
    taskfile: ./coil/Taskfile.yaml
    dir: ./coil
  cilium:
    taskfile: ./cilium/Taskfile.yaml
    dir: ./cilium

vars:
  K8S_VERSION: '{{.K8S_VERSION | default "1.34.8"}}'
  BIRD_VERSION: '{{.BIRD_VERSION | default "3.2.2.1"}}'

  CONTAINERLAB_VERSION: '{{.CONTAINERLAB_VERSION | default "0.79.0"}}'
  CONTAINERLAB_CHECKSUM_AMD64: f90d36d58bb6c4afd3b3a4dca006b81594c6d16f7a04be0184b03f44291085a2
  CONTAINERLAB_CHECKSUM_ARM64: e89e051f71fad7ad1c74c0189fb260539c1f5637e5c10fe53f74fa6b4dbe5298

  MOORING_IMAGE: '{{.MOORING_IMAGE | default "ghcr.io/hanapedia/mooring"}}'
  MOORING_TAG: '{{.MOORING_TAG | default "v0.1.0"}}'

  OPERATOR_IMAGE: '{{.OPERATOR_IMAGE | default "ghcr.io/hanapedia/mooring-operator"}}'
  OPERATOR_TAG: '{{.OPERATOR_TAG | default "dev"}}'
  AGENT_IMAGE: '{{.AGENT_IMAGE | default "ghcr.io/hanapedia/mooring-agent"}}'
  AGENT_TAG: '{{.AGENT_TAG | default "dev"}}'

  # debug container images
  UBUNTU_DEBUG_IMAGE: ghcr.io/cybozu/ubuntu-debug:24.04
  TESTHTTPD_IMAGE: ghcr.io/cybozu/testhttpd:0

tasks:
  start:
    desc: Start k8s on BGP network infrastructure with Coil CNI
    cmds:
      - task: build-bird-container
      - task: start-kind-without-cni
      - task: pull-and-load-debug-images
      - task: coil:install
      - task: install-mooring
      - task: apply-sample-resources

  start-cilium:
    desc: Start k8s on BGP network infrastructure with Cilium CNI
    cmds:
      - task: build-bird-container
      - task: start-kind-without-cni
        vars: { KIND_CONFIG: ../cilium/cluster.kind.yaml }
      - task: pull-and-load-debug-images
      - task: cilium:install
        vars: { K8S_VERSION: "{{.K8S_VERSION}}" }
      - task: install-mooring
      - task: apply-sample-resources

  start-without-mooring:
    desc: Start k8s on BGP network infrastructure with Coil CNI but without mooring
    cmds:
      - task: build-bird-container
      - task: start-kind-without-cni
      - task: pull-and-load-debug-images
      - task: coil:install
      - task: apply-sample-resources
      - task: perf-setup-coil

  stop:
    desc: Stop k8s on BGP network infrastructure
    cmds:
      - task: stop-kind-without-cni

  install-containerlab:
    desc: Download, checksum-verify, and install the pinned containerlab release
    status:
      - test "$(containerlab version --short 2>/dev/null | tr -d 'v')" = "{{.CONTAINERLAB_VERSION}}"
    vars:
      ARCH:
        sh: |
          case "$(uname -m)" in
            x86_64) echo amd64 ;;
            aarch64|arm64) echo arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
      TARBALL: 'containerlab_{{.CONTAINERLAB_VERSION}}_linux_{{.ARCH}}.tar.gz'
      CHECKSUM: '{{if eq .ARCH "amd64"}}{{.CONTAINERLAB_CHECKSUM_AMD64}}{{else}}{{.CONTAINERLAB_CHECKSUM_ARM64}}{{end}}'
    cmds:
      - |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir"' EXIT
        curl -sSLo "$tmpdir/{{.TARBALL}}" \
          "https://github.com/srl-labs/containerlab/releases/download/v{{.CONTAINERLAB_VERSION}}/{{.TARBALL}}"
        echo "{{.CHECKSUM}}  $tmpdir/{{.TARBALL}}" | sha256sum -c -
        tar -xzf "$tmpdir/{{.TARBALL}}" -C "$tmpdir" containerlab
        sudo install -m 0755 "$tmpdir/containerlab" /usr/local/bin/containerlab

  start-kind-without-cni:
    desc: Start kind cluster without CNI
    vars:
      KIND_CONFIG: '{{.KIND_CONFIG | default "cluster.kind.yaml"}}'
    dir: network
    cmds:
      - task: install-containerlab
      - task: generate-cluster-clab-yaml
        vars: { KIND_CONFIG: "{{.KIND_CONFIG}}" }
      - sudo containerlab deploy -t cluster.clab.yaml
      - kind export kubeconfig --name kind-with-bgp

  stop-kind-without-cni:
    desc: Stop kind cluster without kube-proxy and CNI
    dir: network
    cmds:
      - sudo containerlab destroy -t cluster.clab.yaml

  pull-and-load-debug-images:
    desc: Pull and load images for debug
    cmds:
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.UBUNTU_DEBUG_IMAGE}}" }
      - kind load docker-image {{.UBUNTU_DEBUG_IMAGE}} --name kind-with-bgp
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.TESTHTTPD_IMAGE}}" }
      - kind load docker-image {{.TESTHTTPD_IMAGE}} --name kind-with-bgp

  install-mooring-crds:
    desc: Apply mooring CRDs to the cluster
    cmds:
      - kubectl apply -f ../manifests/crds/

  install-mooring:
    desc: Build, load, and install the mooring operator and agent
    cmds:
      - task: build-operator-image
      - task: build-agent-image
      - kind load docker-image {{.OPERATOR_IMAGE}}:{{.OPERATOR_TAG}} --name kind-with-bgp
      - kind load docker-image {{.AGENT_IMAGE}}:{{.AGENT_TAG}} --name kind-with-bgp
      - task: install-mooring-crds
      - |
        yq '
          (select(.kind == "Deployment")
          .spec.template.spec.containers[]
          | select(.name == "operator")
          .image) = "{{.OPERATOR_IMAGE}}:{{.OPERATOR_TAG}}"
        ' ../manifests/operator.yaml | kubectl apply -f -
      - |
        yq '
          (select(.kind == "DaemonSet")
          .spec.template.spec.containers[]
          | select(.name == "agent")
          .image) = "{{.AGENT_IMAGE}}:{{.AGENT_TAG}}"
        ' ../manifests/agent.yaml | kubectl apply -f -
      - kubectl wait -n mooring-system --for=condition=available --timeout=300s deployment/mooring-operator
      - kubectl wait -n mooring-system --for=condition=ready --timeout=300s pod --selector=app=mooring-agent
      - kubectl apply -f network/mooring/natconfig.yaml

  build-operator-image:
    desc: Build the mooring operator container image
    dir: ..
    cmds:
      - docker build -t {{.OPERATOR_IMAGE}}:{{.OPERATOR_TAG}} -f images/operator/Dockerfile .

  build-agent-image:
    desc: Build the mooring agent container image
    dir: ..
    cmds:
      - docker build -t {{.AGENT_IMAGE}}:{{.AGENT_TAG}} -f images/agent/Dockerfile .

  mooring-exec:
    desc: Run moorctl CMD on every mooring pod. Usage; task mooring-exec CMD="unload"
    vars:
      CMD: '{{.CMD | default ""}}'
    cmds:
      - |
        kubectl get pods -n mooring-system -l app=mooring -o name | while read pod; do
          echo "=== $pod ==="
          kubectl exec -n mooring-system "$pod" -c mooring -- moorctl {{.CMD}}
        done

  # ── domestic1 e2e ─────────────────────────────────────────────────────────────
  e2e-domestic1-test:
    desc: Curl domestic1 server (192.168.10.100:8000) from all domestic1-client pods
    cmds:
      - |
        kubectl get pod -n default -l app=domestic1-client -o name | while read pod; do
          echo "=== $pod ==="
          kubectl exec -n default "${pod}" -- curl -s --max-time 10 -w "\n" 192.168.10.100:8000
          kubectl exec -n default "${pod}" -- ping -c 3 192.168.10.100
        done

  apply-sample-resources:
    desc: Apply sample resources
    cmds:
      - kubectl apply -k network/sample/
      - kubectl wait pod -l app=domestic1-client -n default --for condition=Ready --timeout 300s

  build-bird-container:
    desc: Build Bird container
    cmds:
      - "docker build --build-arg BIRD_VERSION={{.BIRD_VERSION}} network/bird -t bird:{{.BIRD_VERSION}}-kind-with-bgp"

  generate-cluster-clab-yaml:
    desc: Generate cluster.clab.yaml
    vars:
      KIND_CONFIG: '{{.KIND_CONFIG | default "cluster.kind.yaml"}}'
      CONTROL_PLANE_IP:
        sh: yq '.[] | select(.name == "control-plane") | .ip' network/nodes.yaml
      CONTROL_PLANE_GW:
        sh: yq '.[] | select(.name == "control-plane") | .gw' network/nodes.yaml
      WORKER_IP:
        sh: yq '.[] | select(.name == "worker") | .ip' network/nodes.yaml
      WORKER_GW:
        sh: yq '.[] | select(.name == "worker") | .gw' network/nodes.yaml
      WORKER2_IP:
        sh: yq '.[] | select(.name == "worker2") | .ip' network/nodes.yaml
      WORKER2_GW:
        sh: yq '.[] | select(.name == "worker2") | .gw' network/nodes.yaml
    cmds:
      - >
        sed
        -e "s/BIRD_VERSION/{{.BIRD_VERSION}}/g"
        -e "s|__KIND_CONFIG__|{{.KIND_CONFIG}}|g"
        -e "s|__CONTROL_PLANE_IP__|{{.CONTROL_PLANE_IP}}|g"
        -e "s|__CONTROL_PLANE_GW__|{{.CONTROL_PLANE_GW}}|g"
        -e "s|__WORKER_IP__|{{.WORKER_IP}}|g"
        -e "s|__WORKER_GW__|{{.WORKER_GW}}|g"
        -e "s|__WORKER2_IP__|{{.WORKER2_IP}}|g"
        -e "s|__WORKER2_GW__|{{.WORKER2_GW}}|g"
        -e "s|__K8S_VERSION__|{{.K8S_VERSION}}|g"
        network/cluster.clab.yaml.tmpl > network/cluster.clab.yaml

  docker-pull:
    desc: Pull a specified image if it doesn't exist locally
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default "ghcr.io/cybozu/ubuntu:24.04"}}'
    cmds:
      - |
        if ! docker image inspect {{.IMAGE_NAME}} &> /dev/null; then
          docker pull --platform=linux/amd64 {{.IMAGE_NAME}}
        else
          echo "{{.IMAGE_NAME}} already exists locally, skip pulling."
        fi

  # ── performance tests ─────────────────────────────────────────────────────────

  perf-setup-coil:
    desc: Deploy Coil AddressPool, Egress, and client pods for performance testing
    cmds:
      - kubectl apply -f network/coil/address-pool.yaml
      - kubectl apply -f network/coil/egress.yaml
      - kubectl apply -f network/coil/client-pods.yaml
      - kubectl wait -n coil-perf --for=condition=available --timeout=300s deployment/perf-egress
      - kubectl wait pod -l app=coil-perf-client -n default --for condition=Ready --timeout 300s

  perf-server-start:
    desc: Start iperf3 server on domestic0 (192.168.0.100)
    cmds:
      - docker exec clab-kind-with-bgp-domestic0 iperf3 -s -D

  perf-server-stop:
    desc: Stop iperf3 server on domestic0
    cmds:
      - docker exec clab-kind-with-bgp-domestic0 pkill iperf3 || true

  perf-mooring-fast:
    desc: "Mooring fast path perf: client and NAT gateway on same node (worker)"
    vars:
      SERVER: 192.168.0.100
      POD: domestic1-client-kind-with-bgp-worker
    cmds:
      - |
        echo "=== Mooring Fast Path: Big Packets ==="
        kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30
      - |
        echo "=== Mooring Fast Path: Small Packets (128-byte blocks) ==="
        kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30 -l 128

  perf-mooring-slow:
    desc: "Mooring slow path perf: client on worker2, NAT gateway on worker"
    vars:
      SERVER: 192.168.0.100
      POD: domestic1-client-kind-with-bgp-worker2
    cmds:
      - |
        echo "=== Mooring Slow Path: Big Packets ==="
        kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30
      - |
        echo "=== Mooring Slow Path: Small Packets (128-byte blocks) ==="
        kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30 -l 128

  perf-coil-fast:
    desc: "Coil fast path perf: client and egress pod on same node (worker)"
    vars:
      SERVER: 192.168.0.100
      POD: coil-perf-client-kind-with-bgp-worker
    cmds:
      - |
        echo "=== Coil Fast Path: Big Packets ==="
        kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30
      - |
        echo "=== Coil Fast Path: Small Packets (128-byte blocks) ==="
        kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30 -l 128

  perf-coil-slow:
    desc: "Coil slow path perf: client on worker2, egress pod on worker"
    vars:
      SERVER: 192.168.0.100
      POD: coil-perf-client-kind-with-bgp-worker2
    cmds:
      - |
        echo "=== Coil Slow Path: Big Packets ==="
        kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30
      - |
        echo "=== Coil Slow Path: Small Packets (128-byte blocks) ==="
        kubectl exec -n default {{.POD}} -- iperf3 -c {{.SERVER}} -t 30 -l 128

  perf-mooring:
    desc: Run performance tests for mooring (fast and slow, big and small packets)
    cmds:
      - task: perf-server-start
      - task: perf-mooring-fast
      - task: perf-mooring-slow
      - task: perf-server-stop

  perf-coil:
    desc: Run performance tests for coil (fast and slow, big and small packets)
    cmds:
      - task: perf-server-start
      - task: perf-coil-fast
      - task: perf-coil-slow
      - task: perf-server-stop
