# https://taskfile.dev
version: '3'

vars:
  K8S_VERSION: '{{.K8S_VERSION | default "1.34.8"}}'
  BIRD_VERSION: '{{.BIRD_VERSION | default "3.2.2.1"}}'

  MOORING_IMAGE: '{{.MOORING_IMAGE | default "ghcr.io/hanapedia/mooring"}}'
  MOORING_TAG: '{{.MOORING_TAG | default "v0.1.0"}}'

  OPERATOR_IMAGE: '{{.OPERATOR_IMAGE | default "ghcr.io/hanapedia/mooring-operator"}}'
  OPERATOR_TAG: '{{.OPERATOR_TAG | default "dev"}}'
  AGENT_IMAGE: '{{.AGENT_IMAGE | default "ghcr.io/hanapedia/mooring-agent"}}'
  AGENT_TAG: '{{.AGENT_TAG | default "dev"}}'

  COIL_VERSION: '{{.COIL_VERSION | default "2.15.0"}}'
  COIL_TAG: '{{.COIL_TAG | default "2.15.0" }}'
  COIL_REPO: '{{.COIL_REPO | default "https://github.com/cybozu-go/coil.git"}}'
  COIL_DIR: '{{.COIL_DIR | default "/tmp/coil"}}'
  COIL_IMAGE: '{{.COIL_IMAGE | default "ghcr.io/cybozu-go/coil"}}'

  # debug container images
  UBUNTU_DEBUG_IMAGE: ghcr.io/cybozu/ubuntu-debug:24.04
  TESTHTTPD_IMAGE: ghcr.io/cybozu/testhttpd:0

tasks:
  start:
    desc: Start k8s on BGP network infrastructure
    cmds:
      - task: build-bird-container
      - task: start-kind-without-cni
      - task: pull-and-load-debug-images
      - task: generate-coil-upstream-manifests
      - task: install-coil
      - task: wait-coil
      - task: install-mooring
      - task: apply-sample-resources

  stop:
    desc: Stop k8s on BGP network infrastructure
    cmds:
      - task: stop-kind-without-cni

  start-kind-without-cni:
    desc: Start kind cluster without kube-proxy and CNI
    dir: network
    cmds:
      - task: generate-cluster-clab-yaml
      - sudo containerlab deploy -t cluster.clab.yaml
      - kind export kubeconfig --name kind-with-bgp

  stop-kind-without-cni:
    desc: Stop kind cluster without kube-proxy and CNI
    dir: network
    cmds:
      - sudo containerlab destroy -t cluster.clab.yaml

  pull-and-load-debug-images:
    desc: Pull and load images for debug
    cmds:
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.UBUNTU_DEBUG_IMAGE}}" }
      - kind load docker-image {{.UBUNTU_DEBUG_IMAGE}} --name kind-with-bgp
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.TESTHTTPD_IMAGE}}" }
      - kind load docker-image {{.TESTHTTPD_IMAGE}} --name kind-with-bgp

  install-coil:
    desc: Install Coil CNI
    vars:
      # Make sure `task generate-coil-upstream-manifests` is run before this task
      COIL_CONFIG_NAME:
        sh: yq 'select(.kind=="ConfigMap") |.metadata.name' network/coil/upstream.yaml
    cmds:
      - task: docker-pull
        vars: { IMAGE_NAME: "{{.COIL_IMAGE}}:{{.COIL_TAG}}" }
      - kind load docker-image {{.COIL_IMAGE}}:{{.COIL_TAG}} --name kind-with-bgp
      - yq '.metadata.name = "{{.COIL_CONFIG_NAME}}"' network/coil/coil-config.tmpl.yaml > network/coil/coil-config.yaml
      - kustomize build --load-restrictor=LoadRestrictionsNone network/coil | kubectl apply -f -

  wait-coil:
    desc: Wait for Coil to become ready
    cmds:
      - kubectl wait -n kube-system --for=condition=available --timeout=300s deployment/coil-ipam-controller
      - kubectl wait -n kube-system --for=condition=available --timeout=300s deployment/coil-egress-controller
      - kubectl wait -n kube-system --for=condition=ready --timeout=300s pod --selector=app.kubernetes.io/name=coil
      - kubectl apply -f network/coil/address_pool.yaml

  generate-coil-upstream-manifests:
    desc: Generate Coil upstream manifests
    cmds:
      - task: clone-coil
      - task: checkout-coil
      - task: generate-coil-certificates
      - kustomize build --load-restrictor=LoadRestrictionsNone {{.COIL_DIR}}/v2 > network/coil/upstream.yaml
      - task: patch-coil-image

  patch-coil-image:
    desc: Patch Coil images in upstream manifests
    cmds:
      # Coild image
      - |
        yq -i '
          (select(.kind == "DaemonSet" and .metadata.name == "coild")
          .spec.template.spec.containers[]
          | select(.name == "coild")
          .image) = "{{.COIL_IMAGE}}:{{.COIL_TAG}}"
          ' network/coil/upstream.yaml
      # Coil ipam controller image
      - |
        yq -i '
          (select(.kind == "Deployment" and .metadata.name == "coil-ipam-controller")
          .spec.template.spec.containers[]
          | select(.name == "coil-ipam-controller")
          .image) = "{{.COIL_IMAGE}}:{{.COIL_TAG}}"
          ' network/coil/upstream.yaml
      # Coil egress controller image
      - |
        yq -i '
          (select(.kind == "Deployment" and .metadata.name == "coil-egress-controller")
          .spec.template.spec.containers[]
          | select(.name == "coil-egress-controller")
          .image) = "{{.COIL_IMAGE}}:{{.COIL_TAG}}"
          ' network/coil/upstream.yaml

  generate-coil-certificates:
    desc: Generate Coil certificates
    cmds:
      - gencert -outdir={{.COIL_DIR}}/v2/config/default -cn=coilv2-webhook-service -host=coilv2-webhook-service.kube-system.svc -certname=cert.pem -keyname=key.pem
      - gencert -outdir={{.COIL_DIR}}/v2/config/default -cn=coilv2-ipam-webhook-service -host=coilv2-ipam-webhook-service.kube-system.svc -certname=ipam-cert.pem -keyname=ipam-key.pem -ca=cert.pem -cakey=key.pem
      - gencert -outdir={{.COIL_DIR}}/v2/config/default -cn=coilv2-egress-webhook-service -host=coilv2-egress-webhook-service.kube-system.svc -certname=egress-cert.pem -keyname=egress-key.pem -ca=cert.pem -cakey=key.pem
      - |
        CACERT_DATA=$(base64 -w0 < {{.COIL_DIR}}/v2/config/default/cert.pem)
        sed "s/%CACERT%/${CACERT_DATA}/g" {{.COIL_DIR}}/v2/config/default/ipam/webhook_manifests_patch.yaml.tmpl > {{.COIL_DIR}}/v2/config/default/ipam/webhook_manifests_patch.yaml
      - |
        CACERT_DATA=$(base64 -w0 < {{.COIL_DIR}}/v2/config/default/cert.pem)
        sed "s/%CACERT%/${CACERT_DATA}/g" {{.COIL_DIR}}/v2/config/default/egress/webhook_manifests_patch.yaml.tmpl > {{.COIL_DIR}}/v2/config/default/egress/webhook_manifests_patch.yaml

  install-mooring-crds:
    desc: Apply mooring CRDs to the cluster
    cmds:
      - kubectl apply -f ../manifests/crds/

  install-mooring:
    desc: Build, load, and install the mooring operator and agent
    cmds:
      - task: build-operator-image
      - task: build-agent-image
      - kind load docker-image {{.OPERATOR_IMAGE}}:{{.OPERATOR_TAG}} --name kind-with-bgp
      - kind load docker-image {{.AGENT_IMAGE}}:{{.AGENT_TAG}} --name kind-with-bgp
      - task: install-mooring-crds
      - |
        yq '
          (select(.kind == "Deployment")
          .spec.template.spec.containers[]
          | select(.name == "operator")
          .image) = "{{.OPERATOR_IMAGE}}:{{.OPERATOR_TAG}}"
        ' ../manifests/operator.yaml | kubectl apply -f -
      - |
        yq '
          (select(.kind == "DaemonSet")
          .spec.template.spec.containers[]
          | select(.name == "agent")
          .image) = "{{.AGENT_IMAGE}}:{{.AGENT_TAG}}"
        ' ../manifests/agent.yaml | kubectl apply -f -
      - kubectl wait -n mooring-system --for=condition=available --timeout=300s deployment/mooring-operator
      - kubectl wait -n mooring-system --for=condition=ready --timeout=300s pod --selector=app=mooring-agent

  build-operator-image:
    desc: Build the mooring operator container image
    dir: ..
    cmds:
      - docker build -t {{.OPERATOR_IMAGE}}:{{.OPERATOR_TAG}} -f images/operator/Dockerfile .

  build-agent-image:
    desc: Build the mooring agent container image
    dir: ..
    cmds:
      - docker build -t {{.AGENT_IMAGE}}:{{.AGENT_TAG}} -f images/agent/Dockerfile .

  mooring-exec:
    desc: Run moorctl CMD on every mooring pod. Usage; task mooring-exec CMD="unload"
    vars:
      CMD: '{{.CMD | default ""}}'
    cmds:
      - |
        kubectl get pods -n mooring-system -l app=mooring -o name | while read pod; do
          echo "=== $pod ==="
          kubectl exec -n mooring-system "$pod" -c mooring -- moorctl {{.CMD}}
        done

  # ── domestic1 e2e ─────────────────────────────────────────────────────────────
  e2e-domestic1-test:
    desc: Curl domestic1 server (192.168.10.100:8000) from domestic1-client pod
    cmds:
      - |
        POD=$(kubectl get pod -n default -l app=domestic1-client -o name | head -1)
        kubectl exec -n default "${POD}" -- curl -s --max-time 10 192.168.10.100:8000
        kubectl exec -n default "${POD}" -- ping -c 3 192.168.10.100

  apply-sample-resources:
    desc: Apply sample resources
    cmds:
      - kubectl apply -k network/sample/
      - kubectl wait deployment --all -n default --for condition=Available --timeout 300s

  clone-coil:
    desc: Clone Coil
    cmds:
      - mkdir -p {{.COIL_DIR}}
      - git clone --depth 1 --branch v{{.COIL_VERSION}} {{.COIL_REPO}} {{.COIL_DIR}}
    status:
      - test -d "{{.COIL_DIR}}/.git"

  checkout-coil:
    desc: Checkout Coil
    cmds:
      - cd {{.COIL_DIR}}; git checkout v{{.COIL_VERSION}}

  build-bird-container:
    desc: Build Bird container
    cmds:
      - "docker build --build-arg BIRD_VERSION={{.BIRD_VERSION}} network/bird -t bird:{{.BIRD_VERSION}}-kind-with-bgp"

  generate-cluster-clab-yaml:
    desc: Generate cluster.clab.yaml
    vars:
      CONTROL_PLANE_IP:
        sh: yq '.[] | select(.name == "control-plane") | .ip' network/nodes.yaml
      CONTROL_PLANE_GW:
        sh: yq '.[] | select(.name == "control-plane") | .gw' network/nodes.yaml
      WORKER_IP:
        sh: yq '.[] | select(.name == "worker") | .ip' network/nodes.yaml
      WORKER_GW:
        sh: yq '.[] | select(.name == "worker") | .gw' network/nodes.yaml
      WORKER2_IP:
        sh: yq '.[] | select(.name == "worker2") | .ip' network/nodes.yaml
      WORKER2_GW:
        sh: yq '.[] | select(.name == "worker2") | .gw' network/nodes.yaml
    cmds:
      - >
        sed
        -e "s/BIRD_VERSION/{{.BIRD_VERSION}}/g"
        -e "s|__CONTROL_PLANE_IP__|{{.CONTROL_PLANE_IP}}|g"
        -e "s|__CONTROL_PLANE_GW__|{{.CONTROL_PLANE_GW}}|g"
        -e "s|__WORKER_IP__|{{.WORKER_IP}}|g"
        -e "s|__WORKER_GW__|{{.WORKER_GW}}|g"
        -e "s|__WORKER2_IP__|{{.WORKER2_IP}}|g"
        -e "s|__WORKER2_GW__|{{.WORKER2_GW}}|g"
        -e "s|__K8S_VERSION__|{{.K8S_VERSION}}|g"
        network/cluster.clab.yaml.tmpl > network/cluster.clab.yaml

  docker-pull:
    desc: Pull a specified image if it doesn't exist in local
    vars:
      IMAGE_NAME: '{{ .IMAGE_NAME| default "ghcr.io/cybozu/ubuntu:24.04" }}'
    cmds:
      - |
        if ! docker image inspect {{.IMAGE_NAME}} &> /dev/null; then
          docker pull --platform=linux/amd64 {{.IMAGE_NAME}}
        else
          echo "{{.IMAGE_NAME}} already exists in local, skip pulling."
        fi
