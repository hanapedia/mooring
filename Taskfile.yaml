# https://taskfile.dev
version: '3'

includes:
  e2e:
    taskfile: ./e2e/Taskfile.yaml
    dir: ./e2e
    optional: true

tasks:
  gen-vmlinux:
    desc: Generate bpf/headers/vmlinux.h from the running kernel (requires bpftool)
    cmds:
      - bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/headers/vmlinux.h

  gen-dev-headers:
    desc: Copy libbpf BPF headers into .dev-headers/bpf/
    vars:
      LIBBPF_BPF_DIR:
        sh: |
          [ -n "${LIBBPF_BPF_DIR:-}" ] && echo "$LIBBPF_BPF_DIR" && exit 0
          for dir in /usr/include/bpf /usr/local/include/bpf; do
            [ -f "$dir/bpf_helpers.h" ] && echo "$dir" && exit 0
          done
          if command -v pkg-config >/dev/null 2>&1 && pkg-config --exists libbpf 2>/dev/null; then
            echo "$(pkg-config --variable=includedir libbpf)/bpf" && exit 0
          fi
          find /nix/store -maxdepth 6 -name "bpf_helpers.h" 2>/dev/null \
            | grep libbpf | sort | tail -1 | sed 's|/bpf_helpers.h||'
    cmds:
      - mkdir -p .dev-headers/bpf
      - cp
        {{.LIBBPF_BPF_DIR}}/bpf_helpers.h
        {{.LIBBPF_BPF_DIR}}/bpf_endian.h
        {{.LIBBPF_BPF_DIR}}/bpf_helper_defs.h
        {{.LIBBPF_BPF_DIR}}/bpf_core_read.h
        .dev-headers/bpf/

  setup:
    desc: Generate all local development artifacts (vmlinux.h and .dev-headers/)
    cmds:
      - task: gen-vmlinux
      - task: gen-dev-headers

  fmt:
    desc: Format Go and C sources (gofumpt + clang-format; skips generated vmlinux.h)
    cmds:
      - find . -name "*.go" -not -path "*/worktrees/*" | xargs gofumpt -l -w
      - clang-format -i bpf/*.c bpf/headers/maps.h bpf/headers/tc.h

  lint:
    desc: Lint Go sources with golangci-lint (creates stub BPF .o files if absent)
    cmds:
      - |
        grep -rh '//go:embed .*\.o' internal/bpf/*.go 2>/dev/null \
          | awk '{print "internal/bpf/"$2}' \
          | xargs touch
      - golangci-lint run ./...

  pinact:
    desc: Pin GitHub Actions workflow steps to commit SHAs
    cmds:
      - pinact run

  test:
    desc: Run controller envtests (operator + daemon) using setup-envtest
    env:
      CGO_ENABLED: "0"
    vars:
      ENVTEST_ASSETS:
        sh: setup-envtest use -p path
    cmds:
      - KUBEBUILDER_ASSETS={{.ENVTEST_ASSETS}} go test ./internal/controller/...

  test-bpf:
    desc: Run privileged eBPF datapath tests via BPF_PROG_TEST_RUN (requires root/CAP_BPF; run `task generate` first)
    cmds:
      - sudo env "PATH=$PATH" go test -tags=bpftest -v ./internal/bpf/...

  generate:
    desc: Generate Go BPF bindings from C sources (requires clang and task setup)
    dir: internal/bpf
    cmds:
      - go generate .
      - task: fmt

  build:
    desc: Build moorctl binary to bin/moorctl
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -o bin/moorctl ./cmd/moorctl

  docker-build:
    desc: Build the moorctl container image
    vars:
      IMAGE: '{{.IMAGE | default "ghcr.io/hanapedia/mooring:latest"}}'
    cmds:
      - docker build -t {{.IMAGE}} .

  docker-build-operator:
    desc: Build the operator container image
    vars:
      IMAGE: '{{.IMAGE | default "ghcr.io/hanapedia/mooring-operator:dev"}}'
    cmds:
      - docker build -t {{.IMAGE}} -f images/operator/Dockerfile .

  docker-build-agent:
    desc: Build the agent (daemon) container image
    vars:
      IMAGE: '{{.IMAGE | default "ghcr.io/hanapedia/mooring-agent:dev"}}'
    cmds:
      - docker build -t {{.IMAGE}} -f images/agent/Dockerfile .

  docker-build-all:
    desc: Build both operator and agent container images
    cmds:
      - task: docker-build-operator
      - task: docker-build-agent

  all:
    desc: Full build (setup → generate → build)
    cmds:
      - task: setup
      - task: generate
      - task: build
