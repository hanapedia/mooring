apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  blocks:
  - cidr: 10.72.32.0/20
  serviceSelector:
    matchExpressions:
      - {key: "lbipam.neco.cybozu.io/address-pool", operator: NotIn, values: ["internet", "internet-cn", "bastion"]}
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: bastion
spec:
  blocks:
  - cidr: 10.72.48.48/28
  serviceSelector:
    matchExpressions:
      - {key: "lbipam.neco.cybozu.io/address-pool", operator: In, values: ["bastion"]}
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
