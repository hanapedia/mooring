# This file is based on cybozu-go/neco/cilium/pre/bgp_config.yaml.
# But this is modified to fit neco-apps-lite
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream.yaml
patches:
  - path: ./hubble-relay.yaml
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: cilium
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/-
        value:
          name: require-k8s-connectivity
          value: "false"
  - target:
      group: batch
      version: v1
      kind: Job
      name: hubble-generate-certs
    patch: |-
      - op: remove
        path: /spec/ttlSecondsAfterFinished
configMapGenerator:
- name: cilium-config
  namespace: kube-system
  behavior: merge
  literals:
  - api-rate-limit=endpoint-create=auto-adjust:true,log:true,estimated-processing-duration:5s,max-parallel-requests:16
- name: cilium-label-prefix
  namespace: kube-system
  files:
    - label-prefix.json
