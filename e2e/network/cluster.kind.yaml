apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
networking:
  disableDefaultCNI: true
  # kubeProxyMode: none
  serviceSubnet: 10.68.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-ip: "10.69.0.2"
      localAPIEndpoint:
        advertiseAddress: "10.69.0.2"
    labels:
      topology.kubernetes.io/zone: rack0
  - role: worker
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-ip: "10.69.0.3"
    labels:
      topology.kubernetes.io/zone: rack0
  - role: worker
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-ip: "10.69.1.2"
    labels:
      topology.kubernetes.io/zone: rack1
  - role: worker
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-ip: "10.69.2.2"
    labels:
      topology.kubernetes.io/zone: rack2
