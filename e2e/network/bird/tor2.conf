router id 10.72.2.2;

log stderr all;

protocol device {
  scan time 10;
}

protocol kernel {
  merge paths;
  ipv4 {
    export filter {
      if source = RTS_DEVICE then reject;
        accept;
    };
  };
}

protocol bgp router0 {
  local as 65003;
  neighbor 10.72.2.1 as 65000;

  ipv4 {
    export all;
    # TODO: describe specific import filters.
    import all;
  };
}

protocol bgp worker3 {
    local as 65003;
    neighbor 10.69.2.2 as 65003;

    direct;
    # rr client;
    passive;
    error wait time 5,20;

    ipv4 {
        import all;
        export filter {
                if proto = "direct1" then reject;
                accept;
        };
    };
}
