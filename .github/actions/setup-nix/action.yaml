name: Setup Nix
description: Install a pinned Nix release with flakes enabled

inputs:
  nix-version:
    description: Nix release to install
    required: false
    default: "2.28.3"
  nix-sha256:
    description: Expected SHA256 of the Nix installer for nix-version
    required: false
    default: "46b8d7165dceb471f4346366b3a93f1009407b99729b843b8664918f4cc800a0"

runs:
  using: composite
  steps:
    - name: Install Nix
      shell: bash
      run: |
        set -euo pipefail
        NIX_VERSION="${{ inputs.nix-version }}"
        INSTALLER="$(mktemp)"

        curl -fsSL "https://releases.nixos.org/nix/nix-${NIX_VERSION}/install" -o "${INSTALLER}"
        echo "${{ inputs.nix-sha256 }}  ${INSTALLER}" | sha256sum -c

        sh "${INSTALLER}" --no-daemon
        rm -f "${INSTALLER}"

    - name: Configure Nix
      shell: bash
      run: |
        mkdir -p ~/.config/nix
        echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
        echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
