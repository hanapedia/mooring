version: "2"

formatters:
  enable:
    - gofumpt

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

  exclusions:
    rules:
      # Close errors in defers are never actionable.
      - linters: [errcheck]
        text: "Error return value of `.+\\.Close` is not checked"

      # scheme.Builder is deprecated for philosophical reasons; kubebuilder still
      # generates this pattern and restructuring the API package is not worth it.
      - linters: [staticcheck]
        path: "api/v1alpha1/groupversion_info.go"
        text: "SA1019"

      # BPF object files are not committed; suppress the embed failure on the
      # bpf2go-generated files so lint passes without the BPF toolchain.
      - linters: [typecheck]
        path: "internal/bpf/"
        text: "no matching files found"
