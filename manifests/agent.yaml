apiVersion: v1
kind: ServiceAccount
metadata:
  name: mooring-agent
  namespace: mooring-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mooring-agent
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["hanapedia.link"]
  resources: ["natconfigs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["hanapedia.link"]
  resources: ["natportrangerequests"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["hanapedia.link"]
  resources: ["natportrangerequests/status"]
  verbs: ["update", "patch"]
- apiGroups: ["hanapedia.link"]
  resources: ["natportranges"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mooring-agent
subjects:
- kind: ServiceAccount
  name: mooring-agent
  namespace: mooring-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mooring-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mooring-agent
  namespace: mooring-system
spec:
  selector:
    matchLabels:
      app: mooring-agent
  template:
    metadata:
      labels:
        app: mooring-agent
    spec:
      serviceAccountName: mooring-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      initContainers:
      - name: mount-bpffs
        image: busybox:1.37
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - grep -q " /sys/fs/bpf bpf " /proc/mounts || mount -t bpf bpf /sys/fs/bpf
        securityContext:
          privileged: true
        volumeMounts:
        - name: bpffs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional

      containers:
      - name: agent
        image: ghcr.io/hanapedia/mooring-agent:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IFACE
          value: "node0"
        - name: BGP_LOCAL_ASN
          value: "64798"
        - name: BGP_REMOTE_ASN
          value: "64799"
        - name: BGP_ROUTER_ID
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: BGP_PEER_ADDR
          value: "127.0.0.1"
        - name: BGP_LOCAL_ADDR
          value: "127.0.0.2"
        - name: REVNAT_ATTACH_MODE
          value: "xdp" # or "tcx"
        securityContext:
          privileged: true
          runAsUser: 0
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: bpffs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
        - name: btf
          mountPath: /sys/kernel/btf
          readOnly: true

      volumes:
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: btf
        hostPath:
          path: /sys/kernel/btf
          type: Directory

      terminationGracePeriodSeconds: 10
